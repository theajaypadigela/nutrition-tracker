# Copy this file to application-local.properties for local development. The
# destination is ignored by Git; never commit real credentials.

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nutrition_tracker}
spring.datasource.username=${DATABASE_USERNAME:nutrition_tracker}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway owns schema creation and applies V1 plus every forward migration to an
# empty database. It deliberately refuses to auto-baseline a non-empty schema.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=true

# JWT (use at least 32 random bytes; do not use the example CI value)
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:86400000}

# Hosted OpenAI-compatible provider. The base URL may include
# /chat/completions; otherwise the application appends it.
ai.provider.base-url=${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
ai.provider.token=${AI_PROVIDER_TOKEN}
ai.provider.model=${AI_PROVIDER_MODEL:gpt-4o-mini}

# Vapi
vapi.private-key=${VAPI_PRIVATE_KEY}
vapi.assistant-id=${VAPI_ASSISTANT_ID}
vapi.api-base-url=${VAPI_API_BASE_URL:https://api.vapi.ai}
# Required outside the local Spring profile. A missing value always causes the
# public webhook to reject requests, including during local development.
vapi.webhook-secret=${VAPI_WEBHOOK_SECRET}
vapi.webhook.max-body-bytes=${VAPI_WEBHOOK_MAX_BODY_BYTES:65536}
vapi.webhook.max-meals=${VAPI_WEBHOOK_MAX_MEALS:20}
