# Safe, non-secret defaults shared by every environment. Environment-specific
# credentials belong in environment variables or an ignored local profile.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nutrition_tracker}
spring.datasource.username=${DATABASE_USERNAME:nutrition_tracker}
spring.datasource.password=${DATABASE_PASSWORD:}

# Flyway is the only schema writer. Existing non-empty databases without
# flyway_schema_history intentionally fail until their baseline is approved.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# The current read paths depend on Open Session in View. Keep that dependency
# explicit until Stage 4 introduces complete transaction boundaries.
spring.jpa.open-in-view=true
