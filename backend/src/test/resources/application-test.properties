# Non-secret values used only by Spring integration tests.
jwt.secret=test-only-jwt-secret-that-is-at-least-thirty-two-bytes
jwt.access-expiration=3600000

ai.provider.base-url=http://127.0.0.1:9/v1
ai.provider.token=test-not-used
ai.provider.model=test-not-used

vapi.private-key=test-not-used
vapi.assistant-id=test-not-used
vapi.api-base-url=http://127.0.0.1:9
vapi.webhook-secret=test-webhook-secret
vapi.webhook.max-body-bytes=65536
vapi.webhook.max-meals=20

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
